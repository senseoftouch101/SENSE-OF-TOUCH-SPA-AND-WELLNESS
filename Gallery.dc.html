<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<title>Gallery · Sense of Touch</title>
<meta name="description" content="Inside Sense of Touch Spa &amp; Wellness.">
<meta property="og:title" content="Gallery · Sense of Touch">
<meta property="og:description" content="Inside Sense of Touch Spa &amp; Wellness.">
<meta property="og:image" content="assets/web/robe-green-lounge.jpg">
<link rel="icon" href="assets/web/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Allura&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<script src="./image-slot.js"></script>
<style>html,body{overflow-x:hidden}a[href^="https://wa.me"],a[href^="tel:"],a[href^="mailto:"],a[href*="instagram"],a[style*="border-bottom"],a[style*="text-transform: uppercase"],button,[type=submit]{min-height:44px!important;display:inline-flex;align-items:center}[style*="font-size: 8px"],[style*="font-size: 9px"],[style*="font-size: 9.5px"],[style*="font-size: 10px"],[style*="font-size: 10.5px"]{font-size:11px!important}p{max-width:min(100%,72ch)!important}p[style*="text-align: center"]{margin-inline:auto!important}h1,h2,h3,p,span,a{overflow-wrap:break-word}:focus-visible{outline:2px solid #C6A15B!important;outline-offset:3px}@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}@media (pointer:coarse){a[style*="border-bottom"],button{min-height:44px}a[style*="border-bottom"]{display:inline-flex;align-items:center}}img,video,iframe{max-width:100%}@media (max-width:720px){[style*="padding: 112px 32px"]{padding:72px 20px!important}[style*="padding: 96px 32px"]{padding:64px 20px!important}[style*="padding: 80px 32px"]{padding:56px 20px!important}[style*="padding: 72px 32px"]{padding:56px 20px!important}[style*="padding: 96px 56px"]{padding:56px 24px!important}[style*="position: sticky; top: 1"]{position:static!important}[style*="grid-column: span 2"]{grid-column:auto!important}[style*="min-height: 720px"]{min-height:440px!important}[style*="padding: 40px;"]{padding:24px!important}}
@media (max-width:720px){[data-3d-opt]{display:none!important}}
html,body{margin:0;background:#F8F4ED;color:#24221D;font-family:Montserrat,sans-serif;-webkit-font-smoothing:antialiased}*{box-sizing:border-box}a{color:#493126;text-decoration:none}a:hover{color:#536B4E}</style>
<script src="./motion.js"></script>
</helmet>
<div style="min-height:100vh;background:#F8F4ED">
<dc-import name="SiteHeader" active="gallery" hint-size="100%,76px" style="position:sticky;top:0;z-index:20;display:block"></dc-import>

<section data-screen-label="Gallery" style="max-width:1280px;margin:0 auto;padding:96px 32px 112px;display:flex;flex-direction:column;gap:40px">
<div style="display:flex;justify-content:space-between;align-items:end;gap:32px;flex-wrap:wrap">
<div style="display:flex;flex-direction:column;gap:20px;flex:1 1 360px">
<span style="font-size:12px;letter-spacing:0.3em;text-transform:uppercase;color:#536B4E;font-weight:600">Gallery</span>
<h1 style="margin:0;font-family:'Cormorant Garamond',serif;font-weight:400;font-size:clamp(48px,6.5vw,88px);line-height:1;color:#493126">Inside the sanctuary</h1>
</div>
<div style="display:flex;flex-direction:column;align-items:flex-end;gap:12px">
<div data-3d="emblem" data-3d-opt="1" data-no-reveal="1" style="position:relative;width:180px;height:180px;cursor:grab;touch-action:pan-y;user-select:none"></div>
<a href="https://www.instagram.com/senseoftouchgh/" target="_blank" rel="noopener" style="font-size:12px;letter-spacing:0.16em;text-transform:uppercase;font-weight:600;border-bottom:1px solid #493126;padding-bottom:4px">More on @senseoftouchgh</a>
</div>
</div>
<div style="position:relative;width:100%;height:clamp(380px,56vw,640px)">
<div data-slides="lounge-group.jpg|facial-treatment.jpg|robe-red-sofa.jpg|body-massage.jpg|lip-closeup.jpg|robe-white-sofa.jpg|wood-therapy.jpg|robe-black-sofa.jpg|facial-greenwall.jpg|robe-green-lounge.jpg" data-captions="The lounge|Facial treatment|Signature red robe|Back massage|The Lip Bar|White robe|Wood therapy|Black robe|Living-wall facial|Green robe" data-no-reveal="1" style="position:absolute;inset:0;border:1px solid #E9DDC9;"></div>
</div>
<div style="display:flex;gap:8px;flex-wrap:wrap">
<sc-for list="{{ filters }}" as="f" hint-placeholder-count="6">
<button onClick="{{ f.select }}" style="all:unset;cursor:pointer;padding:11px 18px;font-size:13px;border:1px solid #493126;background:{{ f.bg }};color:{{ f.fg }}">{{ f.label }}</button>
</sc-for>
</div>
<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr));grid-auto-rows:280px;grid-auto-flow:dense;gap:12px">
<sc-for list="{{ items }}" as="g" hint-placeholder-count="12">
<div data-tilt="1" style="position:relative;grid-row:span {{ g.rows }};display:{{ g.display }}">
<sc-if value="{{ g.hasPhoto }}" hint-placeholder-val="{{ false }}"><div role="img" aria-label="{{ g.ph }}" style="position:absolute;inset:0;background-image:{{ g.bg }};background-size:cover;background-position:{{ g.pos }};background-color:#E9DDC9"></div></sc-if>
<sc-if value="{{ g.noPhoto }}" hint-placeholder-val="{{ true }}"><image-slot id="{{ g.id }}" shape="rect" placeholder="{{ g.ph }}" style="position:absolute;inset:0"></image-slot></sc-if>
<span style="position:absolute;top:12px;left:12px;background:#F8F4ED;color:#493126;padding:6px 10px;font-size:10px;letter-spacing:0.2em;text-transform:uppercase;font-weight:600;pointer-events:none">{{ g.cat }}</span>
</div>
</sc-for>
</div>
</section>
<dc-import name="SocialFeed" placement="gallery" heading="More from our socials" hint-size="100%,640px"></dc-import>
<dc-import name="SiteFooter" hint-size="100%,360px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
const CATS = ['All', 'The lounge', 'Treatments', 'Robes & slippers', 'AFTERCARE', 'The Lip Bar'];
const ITEMS = [
  ['The lounge', 'Guests relaxing in the Sense of Touch lounge', 2, 'lounge-group.jpg', '50% 40%'],
  ['Treatments', 'Back massage', 2, 'body-massage.png', '50% 30%'],
  ['Robes & slippers', 'Signature red robe and slippers', 2, 'robe-red-sofa.jpg', '50% 35%'],
  ['Treatments', 'Facial treatment', 1, 'facial-treatment.png', '50% 50%'],
  ['The lounge', 'Lounge with gold sconces', 2, 'robe-green-lounge.jpg', '50% 55%'],
  ['Robes & slippers', 'White robe and slippers', 1, 'robe-white-sofa.jpg', '30% 50%'],
  ['Treatments', 'Wood therapy', 2, 'wood-therapy.png', '50% 40%'],
  ['Robes & slippers', 'Black robe on the lounge sofa', 2, 'robe-black-sofa.jpg', '50% 50%'],
  ['AFTERCARE', 'AFTERCARE pure ingredients', 1, '', ''],
  ['The lounge', 'Unwinding after a treatment', 1, 'robe-black-relax.jpg', '60% 50%'],
  ['Robes & slippers', 'Burgundy robe', 2, 'robe-red-portrait.jpg', '50% 25%'],
  ['The Lip Bar', 'Glossy lips after The Lip Bar', 2, 'lip-closeup.jpg', '50% 35%'],
  ['The Lip Bar', 'Lip mapping before treatment', 2, 'lips/lip-mapping.jpg', '45% 50%'],
  ['The Lip Bar', 'Soft, glossy fullness', 1, 'lips/lip-gloss-result-1.jpg', '50% 55%'],
  ['The Lip Bar', 'Gentle preparation', 1, 'lips/lip-massage-tool.jpg', '50% 60%'],
  ['The Lip Bar', 'Natural-looking result', 1, 'lips/lip-result-natural.jpg', '50% 45%'],
  ['Treatments', 'Facial under the living wall', 2, 'facial-greenwall.jpg', '50% 55%'],
  ['Robes & slippers', 'Blue robe and slippers', 2, 'robe-blue.jpg', '50% 40%'],
  ['AFTERCARE', 'AFTERCARE mask', 1, '', ''],
  ['The Lip Bar', 'Lip Bar result', 2, 'lip-result-2.jpg', '50% 40%'],
  ['The Lip Bar', 'Client selfie after The Lip Bar', 2, 'lip-selfie-1.jpg', '50% 40%']
];
class Component extends DCLogic {
  state = { cat: 'All' };
  renderVals() {
    const c = this.state.cat;
    return {
      filters: CATS.map(label => ({ label, bg: label === c ? '#493126' : 'transparent', fg: label === c ? '#F8F4ED' : '#493126', select: () => this.setState({ cat: label }) })),
      items: ITEMS.map(([cat, ph, rows, src, pos], i) => ({ cat, ph, rows, id: 'gallery-' + i, hasPhoto: !!src, noPhoto: !src, bg: src ? 'url(assets/web/' + src.replace(/\.png$/, '.jpg') + ')' : 'none', pos: pos || 'center', display: c === 'All' || c === cat ? 'block' : 'none' }))
    };
  }
}
</script>
</body>
</html>
