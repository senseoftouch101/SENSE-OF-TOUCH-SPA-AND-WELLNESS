<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Allura&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
</helmet>
<header ref="{{ root }}" data-nav="1" style="position:relative;background:rgba(248,244,237,0.96);backdrop-filter:blur(8px);border-bottom:1px solid #E9DDC9;font-family:Montserrat,sans-serif">
<sc-if value="{{ hasBanner }}" hint-placeholder-val="{{ false }}"><a href="{{ bannerHref }}" data-screen-label="Announcement bar" style="display:block;background:#493126;color:#F8F4ED;text-align:center;padding:9px 16px;font-size:12px;letter-spacing:0.12em;font-weight:600;text-decoration:none">{{ bannerText }}</a></sc-if>
<div style="max-width:1280px;margin:0 auto;padding:10px clamp(16px,3vw,32px);display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:16px">
<a href="Sense%20of%20Touch%20Homepage.dc.html" style="display:flex;align-items:center;gap:12px;text-decoration:none;min-width:0">
<span style="width:44px;height:52px;overflow:hidden;display:block;flex:none;position:relative"><img src="assets/logo-transparent.png" alt="Sense of Touch logo" style="position:absolute;width:144px;height:144px;max-width:none;left:-50px;top:-27px"></span>
<span style="display:flex;flex-direction:column;line-height:1">
<span style="font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:500;color:#493126;letter-spacing:0.04em;white-space:nowrap">Sense of Touch</span>
<span style="font-size:11px;letter-spacing:0.24em;color:#536B4E;margin-top:4px">SPA &amp; WELLNESS</span>
</span>
</a>
<div style="min-width:0;display:flex;justify-content:center">
<sc-if value="{{ wide }}" hint-placeholder-val="{{ true }}">
<nav aria-label="Main" style="display:flex;flex-wrap:wrap;column-gap:16px;row-gap:4px;justify-content:center;font-size:11px;letter-spacing:0.12em;text-transform:uppercase;font-weight:500;min-width:0">
<sc-for list="{{ links }}" as="l" hint-placeholder-count="8">
<a href="{{ l.href }}" style="color:{{ l.color }};border-bottom:1px solid {{ l.border }};padding:6px 0;text-decoration:none;white-space:nowrap" style-hover="color:#536B4E">{{ l.label }}</a>
</sc-for>
<div ref="{{ cRef }}" style="position:relative">
<button onClick="{{ toggleC }}" aria-expanded="{{ cOpen }}" aria-haspopup="true" style="all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;padding:6px 0;color:{{ cColor }};border-bottom:1px solid {{ cBorder }};white-space:nowrap" style-hover="color:#536B4E">Community<span aria-hidden="true" style="font-size:9px;transform:{{ cRot }};transition:transform .2s">▼</span></button>
<sc-if value="{{ cOpen }}" hint-placeholder-val="{{ false }}"><div role="menu" style="position:absolute;top:calc(100% + 12px);left:50%;transform:translateX(-50%);z-index:30;min-width:280px;background:#FFFDF9;border:1px solid #E9DDC9;box-shadow:0 24px 40px -24px rgba(36,34,29,0.35);display:flex;flex-direction:column;padding:8px;text-transform:none;letter-spacing:0">
<sc-for list="{{ community }}" as="c" hint-placeholder-count="5"><a role="menuitem" href="{{ c.href }}" style="display:flex;flex-direction:column;gap:2px;padding:10px 12px;text-decoration:none;color:#24221D" style-hover="background:#F3EEE6"><span style="font-family:'Cormorant Garamond',serif;font-size:20px;color:#493126">{{ c.label }}</span><span style="font-size:12px;color:#6B665C">{{ c.sub }}</span></a></sc-for>
</div></sc-if>
</div>
</nav>
</sc-if>
</div>
<div style="display:flex;align-items:center;gap:8px">
<sc-if value="{{ wide }}" hint-placeholder-val="{{ true }}"><a href="Account.dc.html" aria-label="My account" style="min-width:44px;min-height:46px;display:inline-flex;align-items:center;justify-content:center;border:1px solid #E9DDC9" style-hover="border-color:#493126"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#493126" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="8.5" r="3.8"></circle><path d="M4.5 20c1.3-3.6 4.2-5.4 7.5-5.4s6.2 1.8 7.5 5.4"></path></svg></a></sc-if>
<a href="Book.dc.html" style="white-space:nowrap;background:#536B4E;color:#F8F4ED;padding:0 clamp(12px,2vw,18px);min-height:46px;display:inline-flex;align-items:center;font-size:clamp(11px,0.4vw + 9.5px,12px);letter-spacing:0.16em;text-transform:uppercase;font-weight:600;text-decoration:none" style-hover="background:#493126;color:#F8F4ED">Book now</a>
<sc-if value="{{ narrow }}" hint-placeholder-val="{{ false }}">
<button onClick="{{ toggle }}" aria-label="{{ menuLabel }}" aria-expanded="{{ open }}" style="all:unset;cursor:pointer;width:46px;height:46px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border:1px solid #493126;box-sizing:border-box">
<span style="width:20px;height:1.5px;background:#493126;display:block;transform:{{ bar1 }};transition:transform .25s"></span>
<span style="width:20px;height:1.5px;background:#493126;display:block;opacity:{{ bar2 }};transition:opacity .2s"></span>
<span style="width:20px;height:1.5px;background:#493126;display:block;transform:{{ bar3 }};transition:transform .25s"></span>
</button>
</sc-if>
</div>
</div>
<sc-if value="{{ showPanel }}" hint-placeholder-val="{{ false }}">
<nav aria-label="Main" style="position:absolute;left:0;right:0;top:100%;background:#F8F4ED;border-bottom:1px solid #E9DDC9;box-shadow:0 24px 40px -24px rgba(36,34,29,0.35);max-height:calc(100vh - 70px);overflow-y:auto;display:flex;flex-direction:column;padding:8px clamp(16px,3vw,32px) 20px">
<sc-for list="{{ links }}" as="l" hint-placeholder-count="8">
<a href="{{ l.href }}" onClick="{{ close }}" style="display:flex;justify-content:space-between;align-items:center;padding:16px 0;border-bottom:1px solid #E9DDC9;font-family:'Cormorant Garamond',serif;font-size:24px;color:{{ l.color }};text-decoration:none" style-hover="color:#536B4E">{{ l.label }}<span style="font-family:Montserrat,sans-serif;font-size:14px;color:#C6A15B">→</span></a>
</sc-for>
<span style="font-size:11px;letter-spacing:0.22em;text-transform:uppercase;font-weight:600;color:#536B4E;margin-top:18px">Community</span>
<sc-for list="{{ community }}" as="c" hint-placeholder-count="5"><a href="{{ c.href }}" onClick="{{ close }}" style="display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #E9DDC9;font-family:'Cormorant Garamond',serif;font-size:21px;color:#493126;text-decoration:none">{{ c.label }}<span style="font-family:Montserrat,sans-serif;font-size:14px;color:#C6A15B">→</span></a></sc-for>
<div style="display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:16px">
<a href="Account.dc.html" style="min-height:44px;display:inline-flex;align-items:center;font-size:13px;color:#493126">My account</a>
<a href="GiftCards.dc.html" style="min-height:44px;display:inline-flex;align-items:center;font-size:13px;color:#493126">Gift cards</a>
<a href="Rewards.dc.html" style="min-height:44px;display:inline-flex;align-items:center;font-size:13px;color:#493126">Rewards</a>
<a href="Occasions.dc.html" style="min-height:44px;display:inline-flex;align-items:center;font-size:13px;color:#493126">Occasions</a>
<a href="Journal.dc.html" style="min-height:44px;display:inline-flex;align-items:center;font-size:13px;color:#493126">Journal</a>
<a href="Membership.dc.html" style="min-height:44px;display:inline-flex;align-items:center;font-size:13px;color:#493126">Membership</a>
<a href="Corporate.dc.html" style="min-height:44px;display:inline-flex;align-items:center;font-size:13px;color:#493126">Corporate</a>
<a href="Consultation.dc.html" style="min-height:44px;display:inline-flex;align-items:center;font-size:13px;color:#493126">Consultation form</a>
<a href="Brochures.dc.html" style="min-height:44px;display:inline-flex;align-items:center;font-size:13px;color:#493126">Brochures</a>
<a href="Site%20Map.dc.html" style="min-height:44px;display:inline-flex;align-items:center;font-size:13px;color:#493126">All pages</a>
</div>
<a href="https://wa.me/233597182026" target="_blank" rel="noopener" style="margin-top:10px;font-size:12px;letter-spacing:0.16em;text-transform:uppercase;font-weight:600;color:#536B4E;text-decoration:none">WhatsApp +233 59 718 2026</a>
</nav>
</sc-if>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:90},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;&quot;,&quot;about&quot;,&quot;services&quot;,&quot;aftercare&quot;,&quot;lipbar&quot;,&quot;founder&quot;,&quot;gallery&quot;,&quot;packages&quot;,&quot;shop&quot;,&quot;contact&quot;],&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
const LINKS = [
  ['home', 'Home', 'Sense%20of%20Touch%20Homepage.dc.html'], ['about', 'About', 'About.dc.html'], ['services', 'Services', 'Services.dc.html'], ['aftercare', 'AFTERCARE', 'Aftercare.dc.html'],
  ['lipbar', 'The Lip Bar', 'LipBar.dc.html'], ['founder', 'Founder', 'Founder.dc.html'], ['gallery', 'Gallery', 'Gallery.dc.html'],
  ['packages', 'Packages', 'Packages.dc.html'], ['academy', 'Institute', 'Institute.dc.html'], ['shop', 'Shop', 'Shop.dc.html'], ['contact', 'Contact', 'Contact.dc.html']
];
const COMM = [['foundation', 'Foundation', 'Foundation.dc.html', 'Scholarships, skills and community wellness'], ['podcast', 'SOT Podcast', 'Podcast.dc.html', 'Conversations on wellness and beauty'], ['careers', 'Careers', 'Careers.dc.html', 'Join the Sense of Touch team'], ['partners', 'Partners & sponsors', 'Partners.dc.html', 'Sponsors, organisations, institutions'], ['investors', 'Investors', 'Investors.dc.html', 'Investor relations']];
class Component extends DCLogic {
  state = { cOpen: false, open: false, w: typeof window !== 'undefined' ? window.innerWidth : 1280 };
  setOpen(v) { this.setState({ open: v }); document.documentElement.style.overflow = v ? 'hidden' : ''; }
  onResize = () => { this.setState({ w: window.innerWidth }); if (window.innerWidth >= 1280 && this.state.open) this.setOpen(false); };
  cRef = React.createRef();
  onKey = (e) => { if (e.key === 'Escape') { if (this.state.open) this.setOpen(false); if (this.state.cOpen) this.setState({ cOpen: false }); } };
  onDown = (e) => { if (this.state.cOpen && this.cRef.current && !this.cRef.current.contains(e.target)) this.setState({ cOpen: false }); if (this.state.open && this.root.current && !this.root.current.contains(e.target)) this.setOpen(false); };
  root = React.createRef();
  componentDidMount() { window.addEventListener('resize', this.onResize); window.addEventListener('keydown', this.onKey); document.addEventListener('pointerdown', this.onDown); }
  componentWillUnmount() { window.removeEventListener('resize', this.onResize); window.removeEventListener('keydown', this.onKey); document.removeEventListener('pointerdown', this.onDown); document.documentElement.style.overflow = ''; }
  renderVals() {
    const bn = (() => { try { return (JSON.parse(localStorage.getItem('sot-v1-site-banner')) || [])[0] || null; } catch (e) { return null; } })();
    const a = this.props.active ?? '';
    const wide = this.state.w >= 1280, open = this.state.open && !wide;
    return { hasBanner: !!(bn && bn.on && bn.text), bannerText: bn ? bn.text : '', bannerHref: (bn && bn.href) || '#', 
      wide, narrow: !wide, open, showPanel: open, root: this.root,
      menuLabel: open ? 'Close menu' : 'Open menu',
      bar1: open ? 'translateY(7.5px) rotate(45deg)' : 'none', bar2: open ? 0 : 1, bar3: open ? 'translateY(-7.5px) rotate(-45deg)' : 'none',
      toggle: () => this.setOpen(!this.state.open),
      close: () => this.setOpen(false),
      cRef: this.cRef, cOpen: this.state.cOpen, toggleC: () => this.setState(s => ({ cOpen: !s.cOpen })), cRot: this.state.cOpen ? 'rotate(180deg)' : 'none', cColor: COMM.some(c => c[0] === a) ? '#536B4E' : '#493126', cBorder: COMM.some(c => c[0] === a) ? '#536B4E' : 'transparent',
      community: COMM.map(([k, label, href, sub]) => ({ label, href, sub })),
      links: LINKS.map(([k, label, href]) => ({ label, href, color: k === a ? '#536B4E' : '#493126', border: k === a ? '#536B4E' : 'transparent' }))
    };
  }
}
</script>
</body>
</html>
